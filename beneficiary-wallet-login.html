<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wallet Login | Guvaza Family Trust</title><link rel="stylesheet" href="/typography.css"><link rel="stylesheet" href="/beneficiary-family.css"><link rel="icon" href="/assets/gft-icon-192.png"><script src="/beneficiary-wallet-access.js" defer></script></head><body><header class="family-header"><div class="family-brand"><img src="/assets/gft-app-192.png" alt="Guvaza Family Trust"><div><strong>Your personal wallet</strong><small>Protected by your six-digit PIN</small></div></div><nav class="family-nav"><a href="beneficiary-family.html">Family Chat</a><a href="index.html">GFT-Home</a></nav></header><main class="wallet-pin-box"><h1 id="walletGateTitle">Wallet Login</h1><p id="walletGateHelp" class="family-caption">Checking wallet access…</p><form id="walletPinForm" hidden><label>Six-digit PIN<input id="walletPin" type="password" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" autocomplete="off" required></label><label id="confirmPinLabel" hidden>Confirm PIN<input id="walletConfirmPin" type="password" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" autocomplete="off"></label><button class="family-button" type="submit" id="walletUnlockButton">Unlock wallet</button></form><p id="walletGateStatus" class="family-status" role="status"></p><p class="family-caption">Returning to Family Chat locks your wallet. Wallet access also expires after 20 minutes. Never share your PIN. An existing PIN cannot be replaced from this screen.</p></main></body></html>
