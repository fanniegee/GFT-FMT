/* ============================================================

============================================================ */

.companies-grid{

/* ============================================================
   COMPANY CARD
   ------------------------------------------------------------
   IMPORTANT:
   The border color is intentionally controlled by the
   company's configured "color" property.

   Founder/Admin can later change:
       company.color

   Companies page simply renders it.
============================================================ */

.company-card{
    background:#1e293b;
    border:1px solid #334155;
    border-radius:16px;
    padding:18px;

    border-left:
        5px solid var(
            --company-color,
            #10b981
        );

    transition:.2s;
    position:relative;
    overflow:hidden;
    color:#e2e8f0;
    cursor:pointer;
}

.company-card:hover{
    transform:translateY(-4px);

    box-shadow:
        0 16px 40px rgba(0,0,0,.25);

    border-color:#fff;
}


/* ============================================================
   LOGO
============================================================ */

.logo-wrap{
    width:72px;
    height:72px;

    background:#0f172a;

    border-radius:12px;

    display:flex;
    align-items:center;
    justify-content:center;

    margin-bottom:14px;

    border:1px solid #334155;

    overflow:hidden;
}

.logo-wrap img{
    max-width:100%;
    max-height:100%;
    object-fit:contain;
}


/* ============================================================
   COMPANY TITLE
============================================================ */

.company-card h3{
    margin:0 0 6px 0;
    font-size:17px;
    color:#f8fafc;
    display:flex;
    align-items:center;
}


/* ============================================================
   COMPANY INFO
============================================================ */

.company-card .info{
    font-size:12px;
    color:#94a3b8;
    margin-bottom:10px;
    line-height:1.4;
}


/* ============================================================
   ID PILL
============================================================ */

.id-pill{
    position:absolute;
    top:12px;
    right:12px;

    background:#0f172a;

    border:1px solid #334155;

    font-size:10px;

    font-weight:800;

    padding:4px 9px;

    border-radius:20px;

    color:#94a3b8;
}


/* ============================================================
   CARD FOOTER
============================================================ */

.card-footer{
    margin-top:12px;

    border-top:
        1px solid #33415533;

    font-size:10px;

    color:#64748b;

    display:flex;

    justify-content:space-between;

    align-items:center;
}


/* ============================================================
   VIEW BUTTON
============================================================ */

.view-btn{
    background:#fff;

    color:#0f172a;

    border:0;

    padding:6px 12px;

    border-radius:8px;

    font-weight:800;

    font-size:11px;

    cursor:pointer;

    display:flex;

    align-items:center;

    gap:4px;
}


/* ============================================================
   MOBILE
   ------------------------------------------------------------
   Same layout behavior, only responsive sizing.
============================================================ */

@media(max-width:700px){

    .content{
        padding:14px;
    }

        padding:22px;
    }

    .hero h1{
        font-size:24px;
    }

    .companies-grid{
        grid-template-columns:
            1fr;
    }

}

<body class="gft-public-page">

     NAVIGATION

<!-- ==========================================================

<div class="content">

    <div class="hero">

            <h1>

                <span
                    class="mi"

<!-- ==========================================================
     COMPANIES PAGE ENGINE
     ----------------------------------------------------------
     IMPORTANT:
     This page is READ-ONLY.

     Founder/Admin will later be responsible for editing
     company configuration.

     This page reads:

         TRUST_CONFIG.companies[]

     Each company keeps:

         id
         name
         logo
         banner
         color
         info
         description
         gallery

     The "color" property is intentionally preserved so
     Founder/Admin can change it later.
=========================================================== -->

<script>

"use strict";


/* ============================================================
   CANONICAL PUBLIC CONFIG
============================================================ */

let CFG =
    window.TRUST_CONFIG || {};

document.addEventListener("DOMContentLoaded", async function () {
    try {
        const response = await fetch('/api/config/public');
        const result = await response.json();

        if (response.ok && result.ok && result.config) {
            CFG = result.config;
        }
    } catch (error) {
        console.warn('Using static company configuration:', error);
    }

    renderCompanies();
});


/* ============================================================
   SAFE TEXT HELPER
============================================================ */

function setCompanyText(
    id,
    value,
    fallback
){

    const element =
        document.getElementById(id);

    if(!element){
        return;
    }

    const finalValue =
        value !== undefined &&
        value !== null &&
        String(value).trim() !== ""
            ? value
            : fallback;

    element.textContent =
        finalValue;
}


/* ============================================================
   SAFE COLOR
   ------------------------------------------------------------
   The color is expected to come from Founder/Admin-managed
   company configuration.

   This helper prevents malformed values from being applied
   as CSS.
============================================================ */

function getCompanyColor(
    value
){

    const color =
        String(value || "")
            .trim();


    /*
     * Hex colors
     */

    if(
        /^#[0-9a-fA-F]{3}$/.test(color) ||
        /^#[0-9a-fA-F]{6}$/.test(color)
    ){

        return color;

    }


    /*
     * rgb / rgba colors
     */

    if(
        /^rgba?\([\d\s.,%]+\)$/.test(color)
    ){

        return color;

    }


    /*
     * Safe default
     */

    return "#10b981";
}


/* ============================================================
   CREATE LOGO
============================================================ */

function createCompanyLogo(
    company
){

    const wrap =
        document.createElement("div");

    wrap.className =
        "logo-wrap";


    if(company.logo){

        const image =
            document.createElement("img");

        image.src =
            company.logo;

        image.alt =
            company.name ||
            "Company logo";


        image.onerror =
            function(){

                image.style.display =
                    "none";

                fallback.style.display =
                    "flex";

            };


        wrap.appendChild(
            image
        );

    }


    const fallback =
        document.createElement("div");

    fallback.style.display =
        company.logo
            ? "none"
            : "flex";

    fallback.style.width =
        "100%";

    fallback.style.height =
        "100%";

    fallback.style.alignItems =
        "center";

    fallback.style.justifyContent =
        "center";

    fallback.style.color =
        "#94a3b8";


    const icon =
        document.createElement("span");

    icon.className =
        "mi";

    icon.textContent =
        "business";


    fallback.appendChild(
        icon
    );

    wrap.appendChild(
        fallback
    );


    return wrap;
}


/* ============================================================
   CREATE COMPANY CARD
============================================================ */

function createCompanyCard(
    company
){

    const card =
        document.createElement("div");

    card.className =
        "company-card";


    /*
     * Company color is deliberately read from:
     *
     *     company.color
     *
     * This is the property Founder/Admin will later edit.
     */

    const companyColor =
        getCompanyColor(
            company.color
        );


    card.style.setProperty(
        "--company-color",
        companyColor
    );


    /*
     * Open company details.
     */

    card.addEventListener(
        "click",
        function(){

            openCompany(
                company.id
            );

        }
    );


    /* --------------------------------------------------------
       ID PILL
    -------------------------------------------------------- */

    const galleryCount =
        Array.isArray(company.gallery)
            ? company.gallery.length
            : 0;


    const idPill =
        document.createElement("div");

    idPill.className =
        "id-pill";

    idPill.textContent =
        "ID: " +
        company.id +
        " • " +
        galleryCount +
        " pics";


    card.appendChild(
        idPill
    );


    /* --------------------------------------------------------
       LOGO
    -------------------------------------------------------- */

    card.appendChild(
        createCompanyLogo(
            company
        )
    );


    /* --------------------------------------------------------
       COMPANY NAME
    -------------------------------------------------------- */

    const heading =
        document.createElement("h3");


    const headingIcon =
        document.createElement("span");

    headingIcon.className =
        "mi";

    headingIcon.style.color =
        companyColor;

    headingIcon.textContent =
        "apartment";


    heading.appendChild(
        headingIcon
    );


    heading.appendChild(
        document.createTextNode(
            company.name ||
            "Unnamed Company"
        )
    );


    card.appendChild(
        heading
    );


    /* --------------------------------------------------------
       COMPANY INFO
    -------------------------------------------------------- */

    const info =
        document.createElement("div");

    info.className =
        "info";

    info.textContent =
        company.info || "";


    card.appendChild(
        info
    );


    /* --------------------------------------------------------
       DESCRIPTION
    -------------------------------------------------------- */

    const description =
        document.createElement("div");


    description.style.fontSize =
        "11px";

    description.style.color =
        "#64748b";

    description.style.marginTop =
        "6px";

    description.style.display =
        "-webkit-box";

    description.style.webkitLineClamp =
        "2";

    description.style.webkitBoxOrient =
        "vertical";

    description.style.overflow =
        "hidden";

    description.textContent =
        company.description || "";


    card.appendChild(
        description
    );


    /* --------------------------------------------------------
       FOOTER
    -------------------------------------------------------- */

    const footer =
        document.createElement("div");

    footer.className =
        "card-footer";


    const ownership =
        document.createElement("span");

    ownership.textContent =
        "Part of " +
        (
            CFG.name ||
            "Trust"
        );


    const viewButton =
        document.createElement("button");

    viewButton.type =
        "button";

    viewButton.className =
        "view-btn";


    const viewIcon =
        document.createElement("span");

    viewIcon.className =
        "mi";

    viewIcon.style.fontSize =
        "16px";

    viewIcon.textContent =
        "visibility";


    viewButton.appendChild(
        viewIcon
    );

    viewButton.appendChild(
        document.createTextNode(
            "View"
        )
    );


    /*
     * Prevent the button click from firing
     * the card's click handler twice.
     */

    viewButton.addEventListener(
        "click",
        function(event){

            event.stopPropagation();

            openCompany(
                company.id
            );

        }
    );


    footer.appendChild(
        ownership
    );

    footer.appendChild(
        viewButton
    );


    card.appendChild(
        footer
    );


    return card;
}


/* ============================================================
   RENDER COMPANIES
============================================================ */

function renderCompanies(){

    const grid =
        document.getElementById(
            "companiesGrid"
        );


    if(!grid){
        return;
    }


    const companies =
        Array.isArray(CFG.companies)
            ? CFG.companies
            : [];


    /*
     * Company count
     */

    setCompanyText(
        "totalCompaniesBadge",

        companies.length +
            " Companies Under The Trust",

        "0 Companies"
    );


    /*
     * Hero title
     */

    setCompanyText(
        "heroTitle",

        (
            CFG.name ||
            "Guvaza Trust"
        ) +
        " Companies",

        "Family Companies"
    );


    /*
     * Hero subtitle
     */

    setCompanyText(
        "heroSub",

        CFG.tagline,

        "Proudly owned and operated by The Guvaza Family Trust"
    );


    /*
     * Clear existing cards
     */

    grid.replaceChildren();


    /*
     * No companies configured
     */

    if(companies.length === 0){

        const empty =
            document.createElement("div");

        empty.style.color =
            "#64748b";

        empty.style.padding =
            "20px";

        empty.textContent =
            "No companies are currently configured.";

        grid.appendChild(
            empty
        );

        return;
    }


    /*
     * Render canonical company configuration.
     */

    companies.forEach(
        function(company){

            if(!company){
                return;
            }

            grid.appendChild(
                createCompanyCard(
                    company
                )
            );

        }
    );

}


/* ============================================================
   COMPANY DETAILS
============================================================ */

function openCompany(
    id
){

    if(
        id === undefined ||
        id === null ||
        id === ""
    ){

        return;

    }


    window.location.href =
        "company.html?id=" +
        encodeURIComponent(id);
}


/* ============================================================
   INITIALIZE
============================================================ */

// Companies page initialization is handled above

</script>
