services:
  postgres:
    image: postgres:16
    container_name: gft-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gft
      POSTGRES_USER: gft_user
      POSTGRES_PASSWORD: CHANGE_THIS_PASSWORD
    ports:
      - "5432:5432"
    volumes:
      - gft_postgres_data:/var/lib/postgresql/data

volumes:
  gft_postgres_data:
