<svg width="600" height="220" viewBox="0 0 600 220" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#B8860B"/>
    </linearGradient>

    <style>
      .company-name {
        font-family: "Times New Roman", serif;
        font-size: 42px;
        font-weight: bold;
        fill: #1F2937;
        letter-spacing: 2px;
      }

      .tagline {
        font-family: Arial, sans-serif;
        font-size: 14px;
        fill: #6B7280;
        letter-spacing: 3px;
      }
    </style>
  </defs>

  <!-- Logo Mark -->
  <g transform="translate(40,30)">

    <!-- Shield -->
    <path d="M70 0 L140 30 L140 100 C140 135 110 160 70 175
             C30 160 0 135 0 100 L0 30 Z"
          fill="#1F2937"/>

    <!-- Mountain -->
    <polygon points="25,95 70,35 115,95"
             fill="url(#gold)"/>

    <!-- Mining Peak -->
    <polygon points="55,95 80,58 105,95"
             fill="#F5F5F5"/>

    <!-- GFT -->
    <text x="70" y="135"
          text-anchor="middle"
          font-family="Arial"
          font-size="34"
          font-weight="bold"
          fill="url(#gold)">
      GFT
    </text>

  </g>

  <!-- Company Name -->
  <text x="220" y="95" class="company-name">
    GFT-MINING
  </text>

  <!-- Divider -->
  <line x1="220" y1="110" x2="520" y2="110"
        stroke="url(#gold)"
        stroke-width="3"/>

  <!-- Tagline -->
  <text x="220" y="145" class="tagline">
    MINING • EXPLORATION • RESOURCES
  </text>

</svg>