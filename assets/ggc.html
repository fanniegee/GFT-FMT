<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 560" role="img" aria-labelledby="title desc">
  <title id="title">Guvaza Geriatric Clinic — GGC</title>
  <desc id="desc">A classic burgundy and gold healthcare emblem symbolising compassionate, dignified geriatric care.</desc>

  <defs>
    <style>
      .burgundy { fill: #701F32; }
      .gold { stroke: #C7A45B; }
      .ivory { fill: #F8F5F0; }
      .brand {
        font-family: Georgia, "Times New Roman", serif;
        fill: #701F32;
      }
      .tagline {
        font-family: Arial, Helvetica, sans-serif;
        font-weight: 600;
        letter-spacing: 2px;
        fill: #701F32;
      }
    </style>
  </defs>

  <!-- Main emblem -->
  <circle cx="350" cy="190" r="139" class="burgundy"/>
  <circle cx="350" cy="190" r="128" fill="none"
          stroke="#C7A45B" stroke-width="2.5"/>
  <circle cx="350" cy="190" r="116" fill="none"
          stroke="#C7A45B" stroke-width="1" opacity=".75"/>

  <!-- Medical cross -->
  <path d="M350 111 V169 M321 140 H379"
        fill="none" stroke="#C7A45B"
        stroke-width="15" stroke-linecap="round"/>

  <!-- Heart -->
  <path d="M350 187
           C331 165 302 177 306 201
           C309 222 336 240 350 250
           C364 240 391 222 394 201
           C398 177 369 165 350 187 Z"
        class="ivory"/>

  <!-- Protective hands -->
  <path d="M269 228
           C286 249 310 261 337 267
           M431 228
           C414 249 390 261 363 267"
        fill="none" class="gold"
        stroke-width="7" stroke-linecap="round"/>

  <path d="M269 228 L283 209 M431 228 L417 209"
        fill="none" class="gold"
        stroke-width="5" stroke-linecap="round"/>

  <!-- Emblem base -->
  <path d="M301 282 Q350 299 399 282"
        fill="none" class="gold" stroke-width="2.5"/>

  <!-- Acronym -->
  <text x="350" y="365" text-anchor="middle"
        class="brand" font-size="76" font-weight="bold"
        letter-spacing="12">GGC</text>

  <!-- Decorative rule -->
  <path d="M112 391 H270 M430 391 H588"
        class="gold" stroke-width="2"/>
  <path d="M340 391 L350 383 L360 391 L350 399 Z"
        fill="#C7A45B"/>

  <!-- Clinic name -->
  <text x="350" y="432" text-anchor="middle"
        class="brand" font-size="25" font-weight="bold"
        letter-spacing="1.2">GUVAZA GERIATRIC CLINIC</text>

  <!-- Tagline -->
  <text x="350" y="472" text-anchor="middle"
        class="tagline" font-size="14">
    INTEGRATED HEALTH AND
  </text>
  <text x="350" y="495" text-anchor="middle"
        class="tagline" font-size="14">
    GERIATRIC NURSING HOME
  </text>

  <!-- Closing accent -->
  <path d="M245 522 H455"
        class="gold" stroke-width="1.5"/>
</svg>
