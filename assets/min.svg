<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Classic Gold Gradient -->
    <linearGradient id="sealGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#F3E5AB" />
      <stop offset="100%" stop-color="#AA771C" />
    </linearGradient>

    <!-- Deep Slate Gradient -->
    <linearGradient id="slateGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1C2833" />
      <stop offset="100%" stop-color="#0F171E" />
    </linearGradient>

    <!-- Arc Path for Curved Text (Top) -->
    <path id="textArcTop" d="M 100,250 A 150,150 0 1,1 400,250" fill="none" />
  </defs>

  <!-- Outer Ring -->
  <circle cx="250" cy="250" r="220" fill="url(#slateGrad)" stroke="url(#sealGold)" stroke-width="8" />
  <circle cx="250" cy="250" r="205" fill="none" stroke="url(#sealGold)" stroke-width="2" stroke-dasharray="6,4" />
  <circle cx="250" cy="250" r="150" fill="none" stroke="url(#sealGold)" stroke-width="3" />

  <!-- Center Symbol: Crossed Pickaxes & Mountain Peaks -->
  <g transform="translate(0, 0)">
    <!-- Mountain Base -->
    <polygon points="250,140 320,260 180,260" fill="url(#sealGold)" opacity="0.3" />
    <polygon points="250,170 300,260 200,260" fill="url(#sealGold)" opacity="0.6" />
    
    <!-- Crossed Hammers / Pickaxes -->
    <!-- Pick 1 -->
    <path d="M 180,180 Q 210,170 240,195 L 310,310 Q 305,315 300,310 Z" fill="url(#sealGold)" />
    <!-- Pick 2 -->
    <path d="M 320,180 Q 290,170 260,195 L 190,310 Q 195,315 200,310 Z" fill="url(#sealGold)" />
  </g>

  <!-- Center Text -->
  <rect x="130" y="230" width="240" height="50" fill="#1C2833" stroke="url(#sealGold)" stroke-width="2" rx="4"/>
  <text x="250" y="268" font-family="'Times New Roman', serif" font-size="38" font-weight="bold" fill="url(#sealGold)" text-anchor="middle" letter-spacing="4">
    G F T
  </text>

  <!-- Subtitle Text inside Emblem -->
  <text x="250" y="340" font-family="'Arial', sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="6">
    MINING CO.
  </text>

  <!-- Decorative Stars -->
  <g fill="url(#sealGold)">
    <polygon points="120,250 123,256 130,257 125,262 126,269 120,265 114,269 115,262 110,257 117,256" />
    <polygon points="380,250 383,256 390,257 385,262 386,269 380,265 374,269 375,262 370,257 377,256" />
  </g>
</svg>