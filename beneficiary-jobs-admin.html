<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Beneficiary employment | GFT</title>
    <link rel="stylesheet" href="typography.css" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: Montserrat, Arial, sans-serif;
        background: #f3f6fa;
        color: #17233b;
        margin: 0;
      }
      main {
        max-width: 1000px;
        margin: auto;
        padding: 24px;
      }
      section,
      article {
        background: white;
        padding: 20px;
        border: 1px solid #dce5f0;
        border-radius: 14px;
        margin: 16px 0;
      }
      article p {
        overflow-wrap: anywhere;
      }
      form {
        display: grid;
        gap: 12px;
      }
      label {
        display: grid;
        gap: 6px;
      }
      input,
      select,
      textarea,
      button {
        font: inherit;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid #b6c7db;
      }
      textarea {
        min-height: 100px;
      }
      button {
        cursor: pointer;
        background: #075fbd;
        color: white;
        border: 0;
        justify-self: start;
      }
      a {
        color: #075fbd;
      }
      h1 {
        font-size: 26px;
      }
      h2 {
        font-size: 21px;
      }
      h3 {
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <main>
      <nav>
        <a href="founder.html">Founder platform</a> ·
        <a href="admin.html">Admin platform</a>
      </nav>
      <h1>Beneficiary employment</h1>
      <p>
        Publish opportunities, review private CVs, and send application replies
        to beneficiaries under Profile.
      </p>
      <p id="status" role="status" aria-live="polite"></p>
      <section>
        <h2>Publish a vacancy</h2>
        <form id="newJob">
          <label>Job title<input name="title" maxlength="160" required /></label
          ><label
            >Company<input name="company" maxlength="160" required
          /></label>
          <label
            >Location<input name="location" maxlength="160" required /></label
          ><label
            >Closing date<input name="closingDate" type="date" required
          /></label>
          <label
            >Job description and requirements<textarea
              name="description"
              maxlength="10000"
              required
            ></textarea></label
          ><button type="submit">Publish vacancy</button>
        </form>
      </section>
      <section>
        <h2>Vacancies</h2>
        <div id="vacancies"></div>
      </section>
      <section>
        <h2>Applications</h2>
        <button type="button" id="refresh">Refresh</button>
        <div id="applications"></div>
      </section>
    </main>
    <script src="beneficiary-job-admin.js"></script>
  </body>
</html>
