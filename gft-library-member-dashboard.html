<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#101a33">
<title>My Library | GFT Library</title>
<link rel="stylesheet" href="typography.css">
<style>
:root{--navy:#142c59;--ink:#142039;--muted:#64748b;--red:#c91d35;--blue:#1a4f9a;--cream:#f6ead3;--line:#e1e7f0;--white:#fff}*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:var(--ink);font-family:Montserrat, Arial, sans-serif}a{color:inherit;text-decoration:none}button,input{font:inherit}.topbar{background:#101a33;color:#fff;padding:17px 5.5%;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font-weight:900;letter-spacing:.07em}.brand span{color:#5bd6e4}.brand small{display:block;font-size:.62rem;letter-spacing:.18em;color:#b6c4dd;margin-top:3px}.toplinks{display:flex;gap:20px;align-items:center;font-size:.9rem;color:#dbe5f7}.toplinks a:hover{color:#65d7e4}.pill{display:inline-flex;align-items:center;justify-content:center;border-radius:12px;padding:11px 16px;background:linear-gradient(110deg,var(--red),#171c31 48%,var(--blue));color:#fff;font-weight:750;border:0;cursor:pointer}.secondary{background:#fff;color:var(--navy);border:1px solid var(--line)}.page{max-width:1180px;margin:auto;padding:34px 24px 60px}.welcome{border-radius:24px;padding:30px;background:linear-gradient(120deg,#111c36,#173c73);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:24px;position:relative;overflow:hidden}.welcome:after{content:"";position:absolute;width:280px;height:280px;border-radius:50%;right:8%;top:-150px;background:#55d6e5;opacity:.13}.welcome>*{position:relative;z-index:1}.eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:.72rem;font-weight:800;color:#7ce2eb}.welcome h1{font-size:clamp(1.8rem,4vw,2.7rem);margin:8px 0}.welcome p{margin:0;color:#d6e1f3;line-height:1.65;max-width:600px}.member-chip{background:#ffffff16;border:1px solid #ffffff2c;padding:12px 15px;border-radius:14px;min-width:150px}.member-chip strong,.member-chip small{display:block}.member-chip small{color:#c6d5eb;margin-top:4px}.notice{margin:18px 0 26px;border:1px solid #f0d6a4;background:#fffaf0;color:#73531c;border-radius:12px;padding:12px 15px;font-size:.84rem;line-height:1.5}.section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin:30px 0 14px}.section-head h2{margin:0;font-size:1.28rem}.section-head p{margin:5px 0 0;color:var(--muted);font-size:.88rem}.quiet-link{color:var(--blue);font-weight:750;font-size:.88rem}.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.quick{background:#fff;border:1px solid var(--line);border-radius:17px;padding:18px;min-height:132px;box-shadow:0 5px 18px #1c2f4b08}.ico{width:42px;height:42px;border-radius:13px;background:var(--cream);display:grid;place-items:center;color:#936a22;font-size:1.25rem;margin-bottom:12px}.quick strong{display:block}.quick span{display:block;color:var(--muted);font-size:.83rem;line-height:1.4;margin-top:5px}.content-grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(260px,1fr);gap:18px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;min-width:0}.book-list{display:grid;gap:14px}.book{display:flex;gap:15px;align-items:center;border-bottom:1px solid #edf0f5;padding-bottom:14px}.book:last-child{border-bottom:0;padding-bottom:0}.cover{width:66px;height:88px;flex-shrink:0;border-radius:7px;background:linear-gradient(145deg,#18345f,#3d7d9a);display:grid;place-items:center;color:#fff;font-size:1.5rem;box-shadow:0 5px 10px #10204022}.cover.red{background:linear-gradient(145deg,#8b1830,#e75b62)}.book-info{flex:1;min-width:0}.book-info strong{display:block}.book-info small{display:block;color:var(--muted);margin-top:5px}.progress{height:6px;background:#e9eef6;border-radius:10px;margin-top:10px;overflow:hidden}.progress i{height:100%;display:block;width:0;background:linear-gradient(90deg,#d41f3a,#1e64ad);border-radius:10px}.book-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}.text-btn{border:0;background:transparent;color:var(--blue);font-size:.82rem;font-weight:750;padding:0;cursor:pointer}.activity{display:grid;gap:15px}.activity-row{display:flex;gap:11px;align-items:flex-start}.dot{width:9px;height:9px;border-radius:50%;background:#28a4c2;margin-top:6px;flex-shrink:0}.activity-row strong{font-size:.9rem}.activity-row small{display:block;color:var(--muted);margin-top:3px;line-height:1.4}.empty-note{color:var(--muted);font-size:.88rem;line-height:1.55}.browse{background:#eaf1fc;border:1px solid #d7e3f5;border-radius:18px;padding:22px;display:flex;justify-content:space-between;align-items:center;gap:20px;margin-top:22px}.browse h3{margin:0 0 6px}.browse p{margin:0;color:#536680;line-height:1.5;font-size:.9rem}.footer{background:#101a33;color:#c5d0e4;padding:24px 5.5%;display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap;font-size:.82rem}.footer strong{color:#fff}.modal-backdrop{position:fixed;inset:0;background:#071326a8;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.modal-backdrop.show{display:flex}.modal{background:#fff;border-radius:18px;padding:24px;max-width:440px;width:100%;box-shadow:0 20px 60px #0004}.modal h2{margin-top:0}.modal p{color:var(--muted);line-height:1.55}.modal input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;margin:7px 0 14px}.modal-actions{display:flex;gap:10px;justify-content:flex-end}@media(max-width:800px){.toplinks{gap:11px;flex-wrap:wrap;justify-content:flex-end}.quick-grid{grid-template-columns:repeat(2,1fr)}.content-grid{grid-template-columns:1fr}.welcome{align-items:flex-start;flex-direction:column}.browse{align-items:flex-start;flex-direction:column}}@media(max-width:520px){.topbar{align-items:flex-start;flex-direction:column}.toplinks{justify-content:flex-start}.page{padding:20px 14px 42px}.welcome{padding:23px}.quick-grid{gap:9px}.quick{padding:14px}.book{align-items:flex-start}.book .cover{width:54px;height:74px}.section-head{align-items:flex-start;flex-direction:column}}
</style></head>
<body>
<header class="topbar"><a class="brand" href="library.html">GFT <span>LIBRARY</span></a><nav class="toplinks"><a href="library.html#catalogue">Browse catalogue</a><button class="pill" id="signOut" type="button">Sign out</button></nav></header>
<main class="page"><section class="welcome"><div><h1>My Library</h1><p id="reader" role="status">Loading reader account…</p></div></section>
<section id="saved" hidden><div class="section-head"><h2>Reading list</h2><a class="quiet-link" href="library.html#catalogue">Find titles</a></div><div class="panel" id="books"></div></section>
<p id="message" role="status"></p></main>
<script>
(() => {
  const get=id=>document.getElementById(id);
  async function request(path,body){
    const response=await fetch('/api/library'+path,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{cache:'no-store'});
    if(response.status===401){location.replace('gft-library-login.html');throw Error('Sign in to open your reading list.');}
    const data=await response.json().catch(()=>({}));
    if(!response.ok) throw Error(data.error || 'Library service unavailable.');
    return data;
  }
  async function load(){
    const {reader,books}=await request('/me');
    get('reader').textContent=reader.name+' · '+reader.email;
    const list=get('books');
    list.textContent=books.length?'':'Your reading list is empty. Save a title from the catalogue to get started.';
    for(const book of books){
      const row=document.createElement('div');row.className='book';
      const heading=document.createElement('strong');heading.textContent=book.title;
      const label=document.createElement('label');label.textContent='Reading progress (%) ';
      const number=document.createElement('input');number.type='number';number.min='0';number.max='100';number.step='1';number.value=book.progress;label.append(number);
      row.append(heading,label);
      for(const [action,text] of [['progress','Save progress'],['remove','Remove']]){
        const control=document.createElement('button');control.type='button';control.className='pill secondary';control.textContent=text;
        control.onclick=async()=>{
          if(action==='progress' && (number.value===''||!number.checkValidity())) return number.reportValidity();
          control.disabled=true;
          try{await request('/reading/'+encodeURIComponent(book.book_id),{action,progress:Number(number.value)});await load();get('message').textContent='Reading list updated.';}
          catch(error){get('message').textContent=error.message;}
          finally{control.disabled=false;}
        };row.append(control);
      }
      list.append(row);
    }
    get('saved').hidden=false;
  }
  get('signOut').onclick=async()=>{try{await request('/logout',{});location.replace('gft-library-login.html');}catch(error){get('message').textContent=error.message;}};
  load().catch(error=>{get('reader').textContent=error.message;});
})();
</script>
</body></html>
